repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md,markdown
      - id: end-of-file-fixer
        exclude: '.basedpyright/baseline.json'
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: check-json
      - id: pretty-format-json
        args:
          - --indent
          - '4'
          - --autofix
          - --no-sort-keys
      - id: check-toml
  - repo: https://github.com/bwhmather/ssort
    rev: e13cd1ee686c9ed9a6c582a4a36b047ef5e1622c  # frozen: 0.19.0
    hooks:
      - id: ssort
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316
    hooks:
      - id: python-no-eval
      - id: python-no-log-warn
  - repo: https://github.com/ikamensh/flynt
    rev: 97be693bf18bc2f050667dd282d243e2824b81e2 # frozen: 1.0.6
    hooks:
      - id: flynt
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312  # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args:
          - --py310-plus
  - repo: https://github.com/MarcoGorelli/auto-walrus
    rev: 1743edbed52f3d61886b59d98a27164a8af29c0d  # frozen: 0.4.1
    hooks:
      - id: auto-walrus
        additional_dependencies:
          - tomli ; python_version < '3.11'
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli ; python_version < '3.11'
  - repo: https://github.com/commitizen-tools/commitizen
    rev: 0c47f153e36705819b4d819508fa913d979c1ccc  # frozen: v4.19.3
    hooks:
      - id: commitizen
  - repo: local
    hooks:
      - id: hatch-types
        entry: hatch run types:check
        language: system
        name: hatch types
        require_serial: true
        types:
          - python
  - repo: https://github.com/andreoliwa/nitpick
    rev: '3ba97e5d57882cca6ef1eccaae683753c8a26630'  # frozen: v0.38.1
    hooks:
      - id: nitpick
  - repo: https://github.com/PyCQA/autoflake
    rev: '6d9dd2716540ab776f29c7b896cd3052ef4619b2'  # frozen: v2.4.0
    hooks:
      - id: autoflake
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: '4380fbb73a154b5f5624794c1c78d9719ccc860f'  # frozen: v2.16.0
    hooks:
      - id: pretty-format-toml
        args:
          - --autofix
          - --no-sort
          - --trailing-commas
          - --indent
          - '4'
          - --inline-comment-spaces
          - '1'
  - repo: https://github.com/TotallyNotRobots/check-spdx-header
    rev: 'ed28eb6be326b6b874764dc83c0a9ced60712f54'  # frozen: 0.4.0
    hooks:
      - id: fix-spdx-header
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'c0f278f1254ccc8fb09676bcdb8d847e7db493e5'  # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args:
          - --fix
        types_or:
          - python
          - pyi
          - pyproject
      - id: ruff-format
minimum_pre_commit_version: 4.3.0
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg
